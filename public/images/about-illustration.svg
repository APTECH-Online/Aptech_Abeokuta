<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aboutTitle">
  <title id="aboutTitle">Illustration of three linked panels representing learning, building, and analysing at APTECH Abeokuta</title>
  <defs>
    <linearGradient id="aboutBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D1250" />
      <stop offset="100%" stop-color="#130C2E" />
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#aboutBg)" />

  <g stroke="#EFC077" stroke-opacity="0.1" fill="none" stroke-width="1">
    <rect x="60" y="60" width="1080" height="300" />
    <rect x="120" y="90" width="960" height="240" />
  </g>

  <!-- connecting trace -->
  <path d="M300 210 H460 M740 210 H900" stroke="#EFC077" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="2 10" />
  <circle cx="300" cy="210" r="5" fill="#EFC077" />
  <circle cx="460" cy="210" r="5" fill="#EFC077" />
  <circle cx="740" cy="210" r="5" fill="#EFC077" />
  <circle cx="900" cy="210" r="5" fill="#EFC077" />

  <!-- panel 1: learn (code window) -->
  <g transform="translate(140,120)">
    <rect width="220" height="180" rx="14" fill="#0F0A25" stroke="#EFC077" stroke-opacity="0.35" />
    <rect width="220" height="30" rx="14" fill="#170F38" />
    <rect y="15" width="220" height="15" fill="#170F38" />
    <circle cx="20" cy="15" r="4" fill="#E2A33D" />
    <circle cx="34" cy="15" r="4" fill="#1CB081" />
    <circle cx="48" cy="15" r="4" fill="#8A7CB0" />
    <g fill="#7C6FB0">
      <rect x="20" y="50" width="70" height="6" rx="3" />
      <rect x="20" y="66" width="120" height="6" rx="3" fill="#EFC077" />
      <rect x="36" y="82" width="140" height="6" rx="3" />
      <rect x="36" y="98" width="90" height="6" rx="3" />
      <rect x="20" y="114" width="60" height="6" rx="3" fill="#1CB081" />
      <rect x="20" y="140" width="150" height="6" rx="3" />
    </g>
    <text x="0" y="-16" fill="#EFC077" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">LEARN</text>
  </g>

  <!-- panel 2: build (bar chart / project) -->
  <g transform="translate(490,120)">
    <rect width="220" height="180" rx="14" fill="#0F0A25" stroke="#EFC077" stroke-opacity="0.35" />
    <g>
      <rect x="30" y="110" width="26" height="45" rx="4" fill="#493195" />
      <rect x="68" y="80" width="26" height="75" rx="4" fill="#EFC077" />
      <rect x="106" y="55" width="26" height="100" rx="4" fill="#1CB081" />
      <rect x="144" y="95" width="26" height="60" rx="4" fill="#493195" />
      <rect x="182" y="35" width="26" height="120" rx="4" fill="#EFC077" />
    </g>
    <line x1="20" y1="160" x2="200" y2="160" stroke="#3A2C6E" stroke-width="1.5" />
    <text x="0" y="-16" fill="#EFC077" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">BUILD</text>
  </g>

  <!-- panel 3: grow (progress / certificate) -->
  <g transform="translate(840,120)">
    <rect width="220" height="180" rx="14" fill="#0F0A25" stroke="#EFC077" stroke-opacity="0.35" />
    <circle cx="110" cy="90" r="46" fill="none" stroke="#3A2C6E" stroke-width="10" />
    <circle cx="110" cy="90" r="46" fill="none" stroke="#EFC077" stroke-width="10" stroke-linecap="round" stroke-dasharray="212 289" transform="rotate(-90 110 90)" />
    <path d="M92 90 l12 12 24 -26" fill="none" stroke="#1CB081" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="150" width="140" height="8" rx="4" fill="#3A2C6E" />
    <rect x="40" y="150" width="95" height="8" rx="4" fill="#EFC077" />
    <text x="0" y="-16" fill="#EFC077" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">GROW</text>
  </g>

  <g fill="none" stroke="#EFC077" stroke-width="1.5" stroke-opacity="0.5">
    <rect x="60" y="330" width="14" height="14" transform="rotate(45 67 337)" />
    <rect x="1120" y="60" width="18" height="18" transform="rotate(45 1129 69)" />
  </g>
</svg>
